name: Build SF MobCapturer

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this validated versioned release'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Type 1.0.6 when publish=true'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mobcapturer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout authoritative English MobCapturer source
        uses: actions/checkout@v4
        with:
          repository: Slimefun-Addon-Community/MobCapturer
          ref: master
          path: .upstream-english
      - name: Checkout exact held Slimefun Legacy core
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: 1cb32d6e95b305998065b8ef6b936a56f679187d
          path: .slimefun-legacy
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore authoritative English adapter text
        shell: bash
        run: |
          set -euo pipefail
          cp .upstream-english/src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java \
             src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java
          find .upstream-english/src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs \
            -maxdepth 1 -type f -name '*.java' \
            ! -name 'SlimeAdapter.java' \
            ! -name 'AnimalsAdapter.java' \
            ! -name 'FrogAdapter.java' \
            -exec cp {} src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/ \;
      - name: Build Slimefun Legacy API target
        shell: bash
        run: |
          set -euo pipefail
          cd .slimefun-legacy
          chmod +x gradlew
          test "$(git rev-parse HEAD)" = "1cb32d6e95b305998065b8ef6b936a56f679187d"
          ./gradlew clean shadowJar -PprojectVersion=ALBION-SNAPSHOT --stacktrace --no-daemon
          cd ..
          mkdir -p libs
          mapfile -t jars < <(find .slimefun-legacy/build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -ge 1
          cp "${jars[0]}" libs/Slimefun-Legacy.jar
      - name: Verify English and dependency policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for root in (Path('src/main/java'), Path('src/main/resources')):
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  try:
                      text=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if re.search(r'[\u3400-\u4dbf\u4e00-\u9fff]', text):
                      bad.append(str(p))
          if bad:
              raise SystemExit('CJK text remains in release source: ' + ', '.join(bad))
          PY
          if grep -En 'net\.guizhanss:guizhanlib|GuizhanLibPlugin' build.gradle.kts; then
            echo 'External GuizhanLib dependency remains in the build.' >&2
            exit 1
          fi
          if grep -R -En 'org\.bstats|new[[:space:]]+Metrics' src/main/java build.gradle.kts; then
            echo 'bStats must not be linked by MobCapturer; it previously caused a runtime constructor conflict on Paper 26.2.' >&2
            exit 1
          fi
          grep -Fq 'version = "1.0.6"' build.gradle.kts
          grep -Fq 'apiVersion = "1.21.11"' build.gradle.kts
          grep -Fq 'releaseJvm = providers.gradleProperty("releaseJvm").orElse("21")' build.gradle.kts
          grep -Fq 'options.release.set(releaseJvm)' build.gradle.kts
          grep -Fq 'Baby: ' src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/AnimalsAdapter.java
          grep -Fq 'Variant: ' src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/FrogAdapter.java
          grep -Fq 'instanceof Keyed keyed' src/main/java/io/github/thebusybiscuit/mobcapturer/utils/compatibility/FrogVariantX.java
          grep -Fq 'class SlimeAdapter<T extends Mob>' src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/SlimeAdapter.java
          grep -Fq 'EntityType.COPPER_GOLEM' src/main/java/io/github/thebusybiscuit/mobcapturer/setup/ModernMobSetup.java
          grep -Fq 'EntityType.valueOf("SULFUR_CUBE")' src/main/java/io/github/thebusybiscuit/mobcapturer/setup/ModernMobSetup.java
          grep -Fq 'ModernMobSetup.setup();' src/main/java/io/github/thebusybiscuit/mobcapturer/MobCapturer.java
          grep -Fq 'Slimefun.getSchedulerService().isOwnedByCurrentRegion(p)' src/main/java/io/github/thebusybiscuit/mobcapturer/listeners/PelletListener.java
          grep -Fq 'Slimefun.getSchedulerService().runFor(' src/main/java/io/github/thebusybiscuit/mobcapturer/listeners/PelletListener.java
          grep -Fq 'Slimefun.getSchedulerService().runAt(location, drop)' src/main/java/io/github/thebusybiscuit/mobcapturer/listeners/PelletListener.java
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT -PreleaseJvm=21 --stacktrace --no-daemon
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=paper -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
      - name: Verify Purpur 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=purpur -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
      - name: Verify Paper 26.3 compilation
        run: ./gradlew clean compileJava -Pplatform=paper -PplatformVersion=26.3.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
      - name: Verify Purpur 26.3 when published
        shell: bash
        run: |
          set -euo pipefail
          METADATA_URL="https://repo.purpurmc.org/snapshots/org/purpurmc/purpur/purpur-api/maven-metadata.xml"
          if curl -fsSL "$METADATA_URL" | grep -q '<version>26\.3\.build\.'; then
            ./gradlew clean compileJava -Pplatform=purpur -PplatformVersion=26.3.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
          else
            echo "Purpur 26.3 API has not been published yet; Paper 26.3 is validated and Purpur 26.3 will be checked automatically once available."
          fi
      - name: Verify Folia 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=folia -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
      - name: Verify Folia 26.3 compilation
        run: ./gradlew clean compileJava -Pplatform=folia -PplatformVersion=26.3.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
      - name: Build universal release JAR from 1.21.11 baseline
        run: ./gradlew clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT -PreleaseJvm=21 --stacktrace --no-daemon
      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SF_MobCapturer1.0.6.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml > build/plugin.yml
          grep -Eq '^api-version:.*1\.21\.11' build/plugin.yml
          grep -Eq '^folia-supported:[[:space:]]*true' build/plugin.yml
          if grep -q 'GuizhanLibPlugin' build/plugin.yml; then exit 1; fi
          if unzip -l "$JAR" | grep -Eq '(^|/)(org/bstats|io/github/thebusybiscuit/mobcapturer/libs/bstats)/'; then
            echo 'bStats classes leaked into the release JAR.' >&2
            exit 1
          fi
          if javap -verbose -classpath "$JAR" io.github.thebusybiscuit.mobcapturer.MobCapturer | grep -qi 'bstats'; then
            echo 'MobCapturer still contains a bStats runtime reference.' >&2
            exit 1
          fi
          javap -verbose -classpath "$JAR" io.github.thebusybiscuit.mobcapturer.MobCapturer | grep -Fq 'major version: 65'
          javap -classpath "$JAR" io.github.thebusybiscuit.mobcapturer.adapters.mobs.CopperGolemAdapter >/dev/null
          javap -classpath "$JAR" io.github.thebusybiscuit.mobcapturer.adapters.mobs.SulfurCubeAdapter >/dev/null
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_MobCapturer1.0.6.jar
          path: build/libs/SF_MobCapturer1.0.6.jar
          archive: false
          if-no-files-found: error


  publish:
    name: Publish validated immutable MobCapturer release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated JAR
        uses: actions/download-artifact@v6
        with:
          name: SF_MobCapturer1.0.6.jar
          path: dist

      - name: Validate explicit publication request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_VERSION" = "1.0.6" || {
            echo 'Refusing publication: confirm_version must be exactly 1.0.6.' >&2
            exit 1
          }
          JAR=dist/SF_MobCapturer1.0.6.jar
          test -s "$JAR"
          TAG=v1.0.6
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing publication: release $TAG already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing publication: tag $TAG already exists." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish validated immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          JAR=dist/SF_MobCapturer1.0.6.jar
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SF MobCapturer 1.0.6" \
            --notes "Validated universal Java 21 MobCapturer build with Paper/Purpur/Folia 26.3 compatibility checks. Publication is explicit and immutable."
