name: Build SF MobCapturer

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobcapturer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout authoritative English MobCapturer source
        uses: actions/checkout@v4
        with:
          repository: Slimefun-Addon-Community/MobCapturer
          ref: master
          path: .upstream-english
      - name: Checkout Slimefun Legacy 4.1.44
        uses: actions/checkout@v4
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: v4.1.44
          path: .slimefun-legacy
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore authoritative English adapter text
        shell: bash
        run: |
          set -euo pipefail
          cp .upstream-english/src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java \
             src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java
          cp .upstream-english/src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/*.java \
             src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/
      - name: Build Slimefun Legacy API target
        shell: bash
        run: |
          set -euo pipefail
          cd .slimefun-legacy
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion=4.1.44 --stacktrace --no-daemon
          cd ..
          mkdir -p libs
          mapfile -t jars < <(find .slimefun-legacy/build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -ge 1
          cp "${jars[0]}" libs/Slimefun-Legacy.jar
      - name: Verify English-only source and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for root in (Path('src/main/java'), Path('src/main/resources')):
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  try:
                      text=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if re.search(r'[\u3400-\u4dbf\u4e00-\u9fff]', text):
                      bad.append(str(p))
          if bad:
              raise SystemExit('CJK text remains in: ' + ', '.join(bad))
          PY
          if grep -R -n 'net\.guizhanss' src/main/java; then
            echo 'Gugu-only source dependency remains.' >&2
            exit 1
          fi
          grep -Fq 'version = "1.0.2"' build.gradle.kts
          grep -Fq 'apiVersion = "1.21.11"' build.gradle.kts
          grep -Fq 'options.release.set(21)' build.gradle.kts
      - name: Verify Paper/Purpur 1.21.11 compilation
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT --stacktrace --no-daemon
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=paper -PplatformVersion=26.2.build.+ --stacktrace --no-daemon
      - name: Verify Purpur 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=purpur -PplatformVersion=26.2.build.+ --stacktrace --no-daemon
      - name: Verify Folia 26.2 compilation
        run: ./gradlew clean compileJava -Pplatform=folia -PplatformVersion=26.2.build.+ --stacktrace --no-daemon
      - name: Build universal release JAR from 1.21.11 baseline
        run: ./gradlew clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT --stacktrace --no-daemon
      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SF_MobCapturer1.0.2.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml > build/plugin.yml
          grep -Eq '^api-version:[[:space:]]+["'"']?1\.21\.11["'"']?$' build/plugin.yml
          grep -q '^folia-supported: true$' build/plugin.yml
          if grep -q 'GuizhanLibPlugin' build/plugin.yml; then exit 1; fi
          javap -verbose -classpath "$JAR" io.github.thebusybiscuit.mobcapturer.MobCapturer | grep -Fq 'major version: 65'
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_MobCapturer1.0.2.jar
          path: build/libs/SF_MobCapturer1.0.2.jar
          archive: false
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v1.0.2"; fi
          JAR=build/libs/SF_MobCapturer1.0.2.jar
          NOTES="English and compatibility release: restores the authoritative English MobCapturer adapter/lore text, translates the remaining item groups, cannon/pellet/spawn-egg descriptions and research text, removes Gugu-only source helpers, targets Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2 with Java 21 release bytecode, and retains Folia 26.2 validation."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF MobCapturer 1.0.2" --notes "$NOTES"
          fi
