name: Build SF MobCapturer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build raw JAR
        run: ./gradlew clean shadowJar --stacktrace

      - name: Verify release artifact
        run: test -f build/libs/SF_MobCapturer1.0.0.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF_MobCapturer1.0.0
          path: build/libs/SF_MobCapturer1.0.0.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/libs/SF_MobCapturer1.0.0.jar --clobber
          else
            gh release create v1.0.0 build/libs/SF_MobCapturer1.0.0.jar \
              --target "$GITHUB_SHA" \
              --title "SF MobCapturer 1.0.0" \
              --notes-file RELEASE_NOTES.md
          fi
